# claude-account model sources that are NOT seats (DGS-224). Data only, no code, no secrets.
# One `name.field=value` per line. Installed to ~/.local/share/claude-account/sources.conf.
#   kind        gateway
#   base_url    ANTHROPIC_BASE_URL for Claude Code
#   key_var     NAME of the variable that holds the key in env_file (the key itself never goes here)
#   env_file    file with KEY=value lines; a leading ~ is expanded; the file is parsed, never sourced
#   model.opus / model.sonnet / model.haiku   the ANTHROPIC_DEFAULT_*_MODEL values
# Seats (OAuth tokens from `claude setup-token`) are not listed here: see ~/.config/claude-accounts/.

# Izanami: Jack's Claude API gateway. No Haiku there, so the Haiku slot uses Sonnet 5.5.
izanami.kind=gateway
izanami.base_url=https://api.grok.coupons
izanami.key_var=IZANAMI_API_KEY
izanami.env_file=~/.digismith-depot/.env
izanami.model.opus=claude-opus-5-5
izanami.model.sonnet=claude-sonnet-5-5
izanami.model.haiku=claude-sonnet-5-5
