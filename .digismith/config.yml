# DigiSmith config for this checkout. Edit by hand or through digismith:preferences.
profile: digismith

preferences:
  finish_option: merge_locally
  clear_context: no
  post_merge_cleanup: auto

nightwatch:
  # How often the Nexus job autonomous-scan looks for a to do + Autonomous ticket, in minutes (whole number, 5 to 720).
  # The scheduler reads this at every tick, so a change needs no API restart. A bad or missing value falls back to 30
  # and the watchdog opens a bad-scan-interval-config item. After a release the factory still rescans at once.
  scan_every_minutes: 15
  # At most this many runs of each kind are busy at once (DGS-665). The factory ticket counts as one builder.
  # 0 blocks the kind. A bad value falls back to the default and shows in dg autonomous status.
  limits:
    builder: 2
    reviewer: 1
    role: 1
  # A run with no event for this long (minutes) stops counting. Clear it for good with: dg run event <run-id> lost
  stale_after_minutes: 120
  protected_paths:
    - hooks/
    - hooks/hooks.json
    - .digismith/config.yml
    - skills/finishing-*/
    - skills/reviewer/
    - packages/cli/src/reviewer/
    - packages/cli/src/autonomous/
    - scripts/nexus-api/src/scheduler/
    - .digismith/mandate.yml
    - .digismith/profiles/
