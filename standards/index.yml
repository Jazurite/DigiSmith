global:
  branch-scope-discipline:
    description: Verify file scope before squashing a branch, diffed against the target base
  code-comments:
    description: Code comment conventions — default to none, WHY-only when non-obvious
  commit-style:
    description: Commit message format — title only, no AI references
  fixing-blockers-mid-task:
    description: Fix genuine blockers found mid-task in the same PR, without bundling unrelated work
  pr-descriptions:
    description: PR description conventions — short and plain, no templated headers/checklists
  ste100-use-cases:
    description: Per-genre writing patterns (errors, PR descriptions, changelogs, agent instructions, etc.) for applying the ASD-STE100 writing standard
  ste100-word-swaps:
    description: Slop-word to plain-word substitution table for AI-generated prose
  ste100-writing:
    description: Writing style for AI-generated prose artifacts (PR descriptions, comments, reports, SKILL.md) — concise, unambiguous, hedge-preserving; not for code or live conversation
  surgical-changes:
    description: Touch only what the request requires; don't refactor or clean up adjacent code

shopify:
  custom-element-components:
    description: Custom element base-class pattern for interactive theme components
  quickscript-asset-loading:
    description: Deferred JS/CSS loading convention using inert quickscript tags
  snippet-render-vs-include:
    description: Use render (not deprecated include) for snippet calls, with migration guidance

team:
  branch-naming:
    description: Branch naming convention for Jira tickets (EMKT-XXX__description format)
  docs-conventions:
    description: Documentation file structure and gitignore conventions
